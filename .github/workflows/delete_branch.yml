name: Delete a deployment

on:
  delete

jobs:
  delete:
    if: github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'dev/') || startsWith(github.event.ref, 'pr/'))
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Get Amplify outputs
        uses: duckbytes/amplify-get-outputs@master
        id: amplify_outputs
        with:
          app-id: ${{ vars.AMPLIFY_APP_ID }}
          branch-name: ${{ github.event.ref }}
      - name: Empty bucket
        if: ${{ steps.amplify_outputs.outputs.bucket_name != '' }}
        run: |
          aws s3 rm --recursive s3://${{ steps.amplify_outputs.outputs.bucket_name }}
      - name: Empty deployment bucket
        if: ${{ steps.amplify_outputs.outputs.deployment_bucket_name != '' }}
        run: |
          aws s3 rm --recursive s3://${{ steps.amplify_outputs.outputs.deployment_bucket_name }}
      - name: Delete the cloudformation stack
        if: steps.amplify_outputs.outputs.stack_name != ''
        run: |
          aws cloudformation delete-stack --stack-name ${{ steps.amplify_outputs.outputs.stack_name }}
          aws cloudformation wait stack-delete-complete --stack-name ${{ steps.amplify_outputs.outputs.stack_name }}
      - name: Delete the amplify environment
        run: |
          aws amplify delete-backend-environment --app-id ${{ vars.AMPLIFY_APP_ID }} --environment-name ${{ steps.amplify_outputs.outputs.env_name }}
      - name: Disconnect the branch
        run: |
          aws amplify delete-branch --app-id ${{ vars.AMPLIFY_APP_ID }} --branch-name ${{ github.event.ref }}
      - name: Sanitize branch name for CDK stack name
        id: sanitize
        uses: actions/github-script@v7
        with:
          script: |
            const deployEnv = context.payload.ref;
            const stackName = deployEnv.replace(/[^A-Za-z0-9-]/g, "-");
            core.setOutput('stack_name', `PlateletCdkStack-${stackName}`);
      - name: Delete the CDK stack
        if: ${{ steps.sanitize.outputs.stack_name != '' }}
        run: |
          STACK_NAME="${{ steps.sanitize.outputs.stack_name }}"
          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" || \
            aws cloudformation delete-stack --stack-name "$STACK_NAME" --deletion-mode FORCE_DELETE_STACK && \
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
